name: Linux SSH

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "কত ঘণ্টা চালু থাকবে (max 6)"
        default: "5"

jobs:
  ssh-over-tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-runner-${{ github.run_id }}
          args: --accept-dns=false

      - name: Get Tailscale IP
        run: |
          for i in $(seq 1 10); do
            TS_IP=$(tailscale ip -4 | head -n1)
            [ -n "$TS_IP" ] && break
            sleep 3
          done
          [ -z "$TS_IP" ] && { echo "Tailscale IP পাওয়া যায়নি"; exit 1; }
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Setup ubuntu user and sshd (Tailscale only)
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd

          id ubuntu >/dev/null 2>&1 || sudo useradd -m -s /bin/bash ubuntu
          echo "ubuntu:root" | sudo chpasswd
          echo "ubuntu ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/ubuntu >/dev/null
          sudo chmod 440 /etc/sudoers.d/ubuntu

          sudo tee /etc/ssh/sshd_config.d/99-custom.conf >/dev/null <<EOF
          Port 22
          ListenAddress $TS_IP
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers ubuntu
          LoginGraceTime 30
          ClientAliveInterval 60
          ClientAliveCountMax 5
          EOF

          # port 22 শুধু tailscale0 থেকে
          sudo iptables -I INPUT -p tcp --dport 22 -j DROP
          sudo iptables -I INPUT -i tailscale0 -p tcp --dport 22 -j ACCEPT
          sudo iptables -I INPUT -i lo -p tcp --dport 22 -j ACCEPT

          sudo sshd -t
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Show login info
        run: |
          nc -z -w 5 "$TS_IP" 22 || { echo "port 22 বন্ধ"; exit 1; }
          echo "=============================="
          echo "Host    : gh-runner-${{ github.run_id }}"
          echo "User    : ubuntu"
          echo "Password: root"
          echo "=============================="

      - name: Keep alive
        run: |
          END=$(( $(date +%s) + ${{ inputs.hours }} * 3600 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            echo "[$(date)] active"
            sleep 120
          done

      - name: Cleanup
        if: always()
        run: sudo tailscale logout || true
